name: Drive sync (daily)

on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 02:00 ICT (Asia/Bangkok)
  workflow_dispatch:

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/drive-scheduler/github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/drive-scheduler/github-actions/package.json
      - run: npm install --no-audit --no-fund
      - name: Run sync (daily pairs)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PERSONAL_REFRESH_TOKEN: ${{ secrets.PERSONAL_REFRESH_TOKEN }}
          WORK_REFRESH_TOKEN: ${{ secrets.WORK_REFRESH_TOKEN }}
        run: node sync.js --frequency daily
